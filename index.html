<template>
  <div class="p-4 md:p-6 space-y-4 md:space-y-6">
    
    <!-- 导航菜单/切换栏 (示例) -->
    <div class="flex gap-2 mb-4 border-b pb-2">
      <button 
        @click="activeMenu = 'schedule'" 
        :class="activeMenu === 'schedule' ? 'bg-matcha-500 text-white font-bold' : 'bg-slate-100 text-slate-600'" 
        class="px-4 py-2 rounded-lg text-xs md:text-sm transition">
        课程表
      </button>
      <button 
        @click="activeMenu = 'students'" 
        :class="activeMenu === 'students' ? 'bg-matcha-500 text-white font-bold' : 'bg-slate-100 text-slate-600'" 
        class="px-4 py-2 rounded-lg text-xs md:text-sm transition">
        学生档案管理
      </button>
    </div>

    <!-- 1. 教学课表 -->
    <div v-if="activeMenu === 'schedule'" class="space-y-4 md:space-y-6">
      <div class="card-style">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-3 mb-4">
          <h3 class="font-bold text-base md:text-lg text-slate-800">课程表</h3>
          
          <div class="flex flex-wrap items-center gap-2 bg-matcha-50/60 p-2 rounded-xl border border-matcha-100 text-xs">
            <div v-for="(cls, idx) in classOptions" :key="cls" class="flex items-center gap-1">
              <span class="font-bold text-slate-700">{{ cls }}:</span>
              <select v-model="classColors[idx]" @change="saveData" class="border rounded px-1 py-0.5 bg-white text-[10px] outline-none">
                <option value="bg-matcha-500 text-white">抹茶绿</option>
                <option value="bg-sky-500 text-white">天空蓝</option>
                <option value="bg-emerald-500 text-white">薄荷绿</option>
                <option value="bg-amber-500 text-white">琥珀黄</option>
                <option value="bg-rose-500 text-white">珊瑚粉</option>
              </select>
            </div>
          </div>
        </div>

        <div class="overflow-x-auto -mx-2 md:mx-0">
          <div class="min-w-[650px] p-2">
            <div class="grid grid-cols-6 gap-1.5 text-center text-xs mb-2">
              <div class="bg-matcha-100/80 font-bold py-2 rounded-lg text-matcha-800">节次 / 时间</div>
              <div v-for="day in ['周一','周二','周三','周四','周五']" :key="day" class="bg-matcha-100/80 font-bold py-2 rounded-lg text-matcha-800">{{ day }}</div>
            </div>

            <div class="space-y-1.5">
              <div v-for="(slot, slotIdx) in timeSlots" :key="slotIdx" class="grid grid-cols-6 gap-1.5 text-center text-xs">
                <div class="bg-slate-50 py-2 px-1 rounded-lg border border-slate-100 flex flex-col justify-center items-center">
                  <span class="font-bold text-slate-700 scale-90 md:scale-100">{{ slot.name }}</span>
                  <span class="text-[9px] text-slate-400 font-mono scale-90">{{ slot.time }}</span>
                </div>

                <div v-for="dIdx in 5" :key="dIdx" 
                     @click="editScheduleCell(slotIdx, dIdx - 1)"
                     class="p-1 rounded-lg border border-slate-100 bg-white hover:border-matcha-500 transition cursor-pointer flex items-center justify-center min-h-[42px] group">
                  <span v-if="timetable[slotIdx] && timetable[slotIdx][dIdx - 1]" 
                        :class="getCellClass(timetable[slotIdx][dIdx - 1])"
                        class="font-bold py-1 px-1.5 rounded text-[11px] shadow-sm w-full truncate">
                    {{ timetable[slotIdx][dIdx - 1] }}
                  </span>
                  <span v-else class="text-slate-300 group-hover:text-matcha-500 text-[10px]">+ 排课</span>
                </div>
              </div>
            </div>
          </div>
        </div>

      </div>
    </div>

    <!-- 2. 学生管理 (Student Management) -->
    <div v-else-if="activeMenu === 'students'" class="space-y-4 md:space-y-6">
      <div class="card-style">
        <div class="flex flex-wrap justify-between items-center gap-2 mb-4">
          <h3 class="font-bold text-base md:text-lg text-slate-800">{{ currentClass }} - 学生档案</h3>
          <div class="flex flex-wrap items-center gap-1.5 md:gap-2">
            <button @click="openAddStudentModal" class="px-2.5 py-1.5 bg-matcha-100 text-matcha-800 rounded-xl text-xs font-medium hover:bg-matcha-200">
              <i class="fa fa-plus"></i> 添加
            </button>
            <button @click="isDesensitized = !isDesensitized" class="px-2.5 py-1.5 border border-matcha-200 rounded-xl text-xs font-medium hover:bg-matcha-50 text-slate-600">
              <i class="fa" :class="isDesensitized ? 'fa-eye' : 'fa-eye-slash'"></i> {{ isDesensitized ? '取消脱敏' : '脱敏' }}
            </button>
            <!-- Excel 导入按钮：已升级支持花名册/成绩单自动更新及分栏表格兼容 -->
            <label class="btn-matcha cursor-pointer">
              <i class="fa fa-upload"></i> 导入花名册/成绩单
              <input type="file" accept=".xlsx, .xls" class="hidden" @change="importExcel" />
            </label>
          </div>
        </div>

        <div class="overflow-x-auto -mx-2 md:mx-0">
          <table class="w-full text-left text-xs md:text-sm min-w-[600px]">
            <thead class="bg-matcha-50/60 text-matcha-800 font-semibold border-b border-matcha-100">
              <tr>
                <th class="p-2.5 md:p-3">学号</th>
                <th class="p-2.5 md:p-3">姓名</th>
                <th class="p-2.5 md:p-3">最近成绩</th>
                <th class="p-2.5 md:p-3">薄弱板块</th>
                <th class="p-2.5 md:p-3">辅导日志</th>
                <th class="p-2.5 md:p-3 text-right">操作</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-slate-100">
              <tr v-for="s in filteredStudents" :key="s.id" class="hover:bg-matcha-50/20">
                <td class="p-2.5 md:p-3 font-mono text-xs text-slate-500 font-bold">{{ s.no }}</td>
                <td class="p-2.5 md:p-3 font-semibold text-slate-700">
                  {{ isDesensitized ? desensitizeName(s.name) : s.name }}
                </td>
                <td class="p-2.5 md:p-3">
                  <button @click="viewStudentAnalytics(s)" title="点击查看历次成绩趋势"
                          :class="s.score >= 120 ? 'bg-emerald-100 text-emerald-700' : s.score >= 90 ? 'bg-sky-100 text-sky-700' : 'bg-rose-100 text-rose-700'"
                          class="px-2 py-0.5 md:px-2.5 md:py-1 rounded-md font-bold text-xs transition flex items-center gap-1">
                    <i class="fa fa-line-chart text-[10px]"></i>
                    {{ s.score }}分
                  </button>
                </td>
                <td class="p-2.5 md:p-3 text-xs text-rose-500 font-medium max-w-[100px] truncate">{{ s.weakness || '无' }}</td>
                <td class="p-2.5 md:p-3 text-xs text-slate-500 max-w-[120px] truncate">{{ s.notes || '暂无' }}</td>
                <td class="p-2.5 md:p-3 text-right space-x-1.5 whitespace-nowrap">
                  <button @click="openEditStudentModal(s)" class="text-xs text-matcha-700 bg-matcha-50 px-2 py-0.5 rounded border border-matcha-200">编辑</button>
                  <button @click="deleteStudent(s)" class="text-xs text-rose-500 hover:underline">删除</button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

  </div>
</template>

<script setup>
import { ref, computed } from 'vue';
import * as XLSX from 'xlsx'; // 确保项目安装了 xlsx 依赖 (npm install xlsx)

// 基础状态定义
const activeMenu = ref('students');
const currentClass = ref('高二(11)班');
const isDesensitized = ref(false);

const classOptions = ref(['高二(11)班', '高二(12)班']);
const classColors = ref(['bg-matcha-500 text-white', 'bg-sky-500 text-white']);

// 1. 作息时间表数组 (根据需要修改此处的时间段)
const timeSlots = ref([
  { name: '第一节', time: '08:00 - 08:40' },
  { name: '第二节', time: '08:50 - 09:30' },
  { name: '第三节', time: '09:50 - 10:30' },
  { name: '第四节', time: '10:40 - 11:20' },
  { name: '第五节', time: '11:30 - 12:10' },
  { name: '第六节', time: '14:00 - 14:40' },
  { name: '第七节', time: '14:50 - 15:30' },
  { name: '第八节', time: '15:50 - 16:30' },
  { name: '第九节', time: '16:40 - 17:20' },
  { name: '晚修一', time: '18:30 - 19:30' },
  { name: '晚修二', time: '19:40 - 20:40' },
  { name: '晚修三', time: '20:50 - 21:50' }
]);

// 课程表矩阵数据 (二维数组)
const timetable = ref(
  Array.from({ length: 12 }, () => Array(5).fill(''))
);

// 学生档案列表数据
const students = ref([]);

// 过滤当前班级的学生
const filteredStudents = computed(() => {
  return students.value.filter(s => !s.class || s.class === currentClass.value);
});

// 2. Excel/CSV 兼容导入函数 (深度解决双排分栏花名册 + 自动成绩合并)
const importExcel = (e) => {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = (evt) => {
    try {
      const data = new Uint8Array(evt.target.result);
      const workbook = XLSX.read(data, { type: 'array' });
      const firstSheetName = workbook.SheetNames[0];
      const worksheet = workbook.Sheets[firstSheetName];
      
      // 全表格转为二维数组进行全单元格扫描，完美解决《学生名单11班.xlsx》双排打印问题
      const rawRows = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
      const newStudentsMap = new Map();

      // 获取无后缀的文件名（例如“高二期中考试成绩.xlsx” -> “高二期中考试成绩”）
      const examName = file.name.replace(/\.[^/.]+$/, "");

      rawRows.forEach((row) => {
        if (!row || row.length === 0) return;

        row.forEach((cell, colIndex) => {
          // 匹配纯数字学号 (如 1, 2, ..., 56)
          if (cell !== undefined && cell !== null && !isNaN(cell) && String(cell).trim() !== '') {
            const no = String(cell).trim();
            let name = '';
            let score = null;

            // 向右边搜索紧邻的姓名与成绩
            for (let i = colIndex + 1; i < row.length; i++) {
              const nextVal = row[i];
              if (nextVal !== undefined && nextVal !== null && String(nextVal).trim() !== '') {
                const strVal = String(nextVal).trim();
                // 排除表头“姓名”和“学号”干扰，认定为有效姓名
                if (isNaN(strVal) && strVal !== '姓名' && strVal !== '学号' && !name) {
                  name = strVal;
                } else if (!isNaN(strVal) && name && score === null) {
                  // 姓名右侧的数值认定为成绩
                  score = Number(strVal);
                  break;
                }
              }
            }

            if (name) {
              newStudentsMap.set(no, { no, name, score });
            }
          }
        });
      });

      if (newStudentsMap.size === 0) {
        alert('未在文件中解析到有效的学生数据，请检查文件格式！');
        return;
      }

      // 增量合并导入的数据
      newStudentsMap.forEach((item, no) => {
        let student = students.value.find(s => String(s.no) === String(no) || s.name === item.name);

        if (student) {
          // 已经存在：补全学号与真实姓名
          student.no = no;
          student.name = item.name;

          // 若导入的是成绩单，同步更新成绩并追加历史轨迹
          if (item.score !== null) {
            student.score = item.score;
            if (!student.history) student.history = [];
            student.history.push({
              exam: examName,
              score: item.score,
              date: new Date().toLocaleDateString()
            });
          }
        } else {
          // 不存在：建新学生档案
          students.value.push({
            id: Date.now() + Math.random(),
            no: item.no,
            name: item.name,
            score: item.score !== null ? item.score : 0,
            weakness: '待分析',
            notes: '暂无',
            class: currentClass.value,
            history: item.score !== null ? [{
              exam: examName,
              score: item.score,
              date: new Date().toLocaleDateString()
            }] : []
          });
        }
      });

      saveData();
      alert(`成功导入/更新 ${newStudentsMap.size} 名学生档案！`);

    } catch (error) {
      console.error(error);
      alert('解析 Excel 文件时出错，请确认文件格式。');
    } finally {
      e.target.value = ''; // 清空选择器，允许重复上传同一文件
    }
  };

  reader.readAsArrayBuffer(file);
};

// 脱敏函数 (例如: 徐梓涵 -> 徐*涵)
const desensitizeName = (name) => {
  if (!name) return '未知';
  if (name.length <= 2) return name.substring(0, 1) + '*';
  return name.substring(0, 1) + '*'.repeat(name.length - 2) + name.substring(name.length - 1);
};

// 样式与操作辅助函数
const getCellClass = (val) => {
  if (!val) return '';
  const idx = classOptions.value.indexOf(val);
  return idx !== -1 ? classColors.value[idx] : 'bg-slate-100 text-slate-700';
};

const editScheduleCell = (slotIdx, dayIdx) => {
  const currentVal = timetable.value[slotIdx][dayIdx];
  const input = prompt('修改排课课程/班级:', currentVal);
  if (input !== null) {
    timetable.value[slotIdx][dayIdx] = input.trim();
    saveData();
  }
};

const openAddStudentModal = () => {
  const name = prompt('请输入学生姓名:');
  const no = prompt('请输入学生学号:');
  if (name && no) {
    students.value.push({
      id: Date.now(),
      no: no.trim(),
      name: name.trim(),
      score: 0,
      weakness: '待分析',
      notes: '暂无',
      class: currentClass.value,
      history: []
    });
    saveData();
  }
};

const openEditStudentModal = (student) => {
  const newScore = prompt(`修改 ${student.name} 的数学成绩:`, student.score);
  if (newScore !== null && !isNaN(newScore)) {
    student.score = Number(newScore);
    if (!student.history) student.history = [];
    student.history.push({
      exam: '平时修改',
      score: Number(newScore),
      date: new Date().toLocaleDateString()
    });
    saveData();
  }
};

const deleteStudent = (student) => {
  if (confirm(`确定要删除学生 ${student.name} 吗？`)) {
    students.value = students.value.filter(s => s.id !== student.id);
    saveData();
  }
};

const viewStudentAnalytics = (student) => {
  alert(`【${student.name}】历次成绩记录:\n` + 
    (student.history && student.history.length > 0 
      ? student.history.map(h => `${h.date} - ${h.exam}: ${h.score}分`).join('\n')
      : '暂无历史考试记录')
  );
};

// 本地数据持久化保存
const saveData = () => {
  localStorage.setItem('teaching_students', JSON.stringify(students.value));
  localStorage.setItem('teaching_timetable', JSON.stringify(timetable.value));
};
</script>

<style scoped>
/* 保持你的基础卡片与按钮样式 */
.card-style {
  @apply bg-white p-4 md:p-6 rounded-2xl border border-slate-100 shadow-sm;
}
.btn-matcha {
  @apply px-2.5 py-1.5 bg-matcha-500 text-white rounded-xl text-xs font-medium hover:bg-matcha-600 transition flex items-center gap-1;
}
</style>
